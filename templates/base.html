{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShortURL</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            background: #111;
            color: white;
        }

        .container {
            padding: 20px;
        }

        a {
            color: white;
            margin-right: 10px;
            text-decoration: none;
        }

        .btn {
            padding: 6px 10px;
            background: #ffffff;
            border-radius: 6px;

            display: inline-flex;
            align-items: center;
            gap: 6px;

            color: #111;
        }

        .btn:hover {
            background: #f2f2f2;
            cursor: pointer;
        }

        .username {
            margin-right: 18px;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

    <div>
        <a style="font-size: 28px;" href="/">ShortURL</a>
        {% if user.is_authenticated %}
            <a style="font-size: 16px;" href="/create/">Create</a>
            <a style="font-size: 16px;" href="/analytics/">Analytics</a>
        {% endif %}
    </div>

    <div>
        {% if user.is_authenticated %}
            <span class="username">Hello, {{ user.last_name }}{{ user.first_name }}</span>
            <a class="btn" href="/accounts/logout/">Logout</a>
        {% else %}
            <a class="btn" href="/accounts/google/login/">
                <img src="{% static 'img/google.svg' %}" width="18" style="vertical-align: middle;">
                Google Login
            </a>
            <a class="btn" href="/accounts/facebook/login/">
                <img src="{% static 'img/meta.svg' %}" width="18" style="vertical-align: middle;">
                Facebook Login
            </a>
        {% endif %}
    </div>

</div>

<!-- PAGE CONTENT -->
<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
