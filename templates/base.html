<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShortURL</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            background: #111;
            color: white;
        }

        .container {
            padding: 20px;
        }

        a {
            color: white;
            margin-right: 10px;
            text-decoration: none;
        }

        .btn {
            padding: 6px 10px;
            background: #444;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

    <div>
        <a href="/">ShortURL</a>
        {% if user.is_authenticated %}
            <a href="/create/">Create</a>
            <a href="/analytics/">Analytics</a>
        {% endif %}
    </div>

    <div>
        {% if user.is_authenticated %}
            <span>{{ user.username }}</span>
            <a class="btn" href="/accounts/logout/">Logout</a>
        {% else %}
            <a class="btn" href="/accounts/google/login/">Login</a>
        {% endif %}
    </div>

</div>

<!-- PAGE CONTENT -->
<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
